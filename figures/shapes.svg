<svg xmlns="http://www.w3.org/2000/svg" width="788" height="368" viewBox="0 0 788 368" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="788" height="368" rx="6" fill="#fbfbfa"/>
<text x="22" y="34" font-size="15" font-weight="600" fill="#1f2328">What a scenario is: the same work, four dependency structures</text>
<text x="22" y="56" font-size="12" fill="#6e7781">Six subtasks of equal size in every case. Only the edges differ -- and the edges are what should change whether fanning out</text>
<text x="22" y="73" font-size="12" fill="#6e7781">is the right call. An arrow means the target consumes an artifact the source produces, so it cannot start first.</text>
