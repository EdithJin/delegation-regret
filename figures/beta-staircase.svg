<text x="48" y="52" font-size="12" fill="#6e7781">Derived from the oracle, not measured. Six equal subtasks; only the dependency structure differs.</text>
<text x="48" y="70" font-size="12" fill="#6e7781">Cost constants are placeholders. At the background persona (beta = $0, nobody waiting) every shape says spawn 0.</text>
