<text x="594" y="308" font-size="10.5" fill="#6e7781">$1.00/min -- far off-scale right.</text>
<text x="594" y="322" font-size="10.5" fill="#6e7781">Every shape has saturated by</text>
<text x="594" y="336" font-size="10.5" fill="#6e7781">$0.25, so no curve moves again.</text>
